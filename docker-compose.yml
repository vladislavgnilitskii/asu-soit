# Локальный тест-стенд: PostgreSQL + Go-бэкенд одной командой.
#   docker compose up --build         — поднять
#   docker compose down               — остановить (данные сохраняются)
#   docker compose down -v            — остановить и стереть БД (чистый прогон)
#
# Фронт пока запускается отдельно (cd frontend && npm run dev): его dev-сервер
# проксирует /api на бэкенд :8080. Фронт-сервис добавим, когда UI устаканится.

services:
  postgres:
    # образ с «запечёнными» миграциями и dev-сидом (см. db/Dockerfile).
    # Миграции применяются при ПЕРВОЙ инициализации пустой БД (docker compose
    # down -v для чистого прогона), по порядку имён (001…016), как superuser.
    build: ./db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asu_soit
    volumes:
      # Postgres 18+ хранит данные в /var/lib/postgresql (подкаталог по версии),
      # а не в /var/lib/postgresql/data — монтируем именно сюда
      - pgdata:/var/lib/postgresql
    ports:
      # 5433 на хосте, чтобы не конфликтовать с локальным postgres на 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asu_soit"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: asu_soit
      # приложение ходит непривилегированной ролью app_backend (миграция 015)
      DB_USER: app_backend
      DB_PASSWORD: app_backend_pw
      APP_PORT: "8080"
      APP_ENV: development
      # dev-значения; для production переопределить на секреты
      JWT_SECRET: dev-jwt-secret-change-me
      JWT_EXPIRES_IN: 24h
      CRYPTO_KEY: dev-crypto-key-change-me
    ports:
      - "8080:8080"

volumes:
  pgdata:
